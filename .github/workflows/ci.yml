name: ci
on:
  push:
  pull_request:
  schedule: [{cron: "17 3 * * *"}]
  workflow_dispatch:
defaults:
  run: {working-directory: track_1b}
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]" jinja2==3.1.4 numpy==2.1.3
      - name: unit, mutation, oracle and statute tests
        run: python -m pytest -q
      - name: make run steps 1-2 without Docker (dataset regenerates; results recompute)
        run: statute-twins selfcheck
      - name: quality-control gates (schema, gold, twins, duplicates, language, PII, canary)
        run: statute-twins qc --out /tmp/qc.json
      - name: every number in the README, report and notes maps to a results file (claims.tsv)
        run: python scripts/check_claims.py
  make-run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: make run (clean checkout, Docker, CPU), timed
        run: /usr/bin/time -v make run 2>&1 | tee /tmp/make_run.log; grep -q "SELF-CHECK PASS" /tmp/make_run.log
  llamacpp-engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/cache@v4
        id: cache
        with: {path: /tmp/wheels, key: llama-cpp-python-0.3.19-avx2-py312}
      - name: build llama-cpp-python 0.3.19 (cached)
        if: steps.cache.outputs.cache-hit != 'true'
        env: {CMAKE_ARGS: "-DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON"}
        run: pip wheel --no-deps -w /tmp/wheels llama-cpp-python==0.3.19
      - name: backend equals the logits_all reference on a tiny real GGUF
        run: |
          pip install -e ".[dev]" numpy==2.1.3 jinja2==3.1.4 diskcache==5.6.3 typing-extensions
          pip install --no-deps /tmp/wheels/llama_cpp_python-0.3.19-*.whl
          curl -sSL -o /tmp/tiny.gguf https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf
          TINY_GGUF=/tmp/tiny.gguf python -m pytest -q tests/test_llamacpp_real.py tests/test_backends.py
