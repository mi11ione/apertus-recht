elements: "\n\nPrüfe die Tatbestandsmerkmale von Art. 179ter StGB: Gesprächsteilnahme, nichtöffentliches Gespräch, Aufnahme auf einen Tonträger und fehlende Einwilligung der anderen Beteiligten."
complaint_rule: " Die Tat wird nur auf Antrag verfolgt; das Antragsrecht erlischt drei Monate, nachdem der antragsberechtigten Person der Täter bekannt wird (Art. 31 StGB)."
tails:
  conv: " Würde ein Schweizer Gericht die Person allein nach Art. 179ter StGB verurteilen? Antworte mit Ja oder Nein."
  ver: " Wie lautet das Urteil eines Schweizer Gerichts, allein bezogen auf Art. 179ter StGB? Antworte mit «schuldig» oder «nicht schuldig»."
