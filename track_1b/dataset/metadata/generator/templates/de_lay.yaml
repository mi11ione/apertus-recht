# German, in the voice of a user asking about their own conduct (A9): the same scenarios and facts as de.yaml, told
# in the first person and in everyday words. No legal conclusions are stated (no "in einer gegen die Menschenwürde
# verstossenden Weise", no "Vorsatz"); the act is described concretely enough that the dignity threshold is met, the
# group is named without its characteristic. Actors are unused (first person); slot ids are shared with design.yaml.
lang: de_lay
frames:
  F01: '{Date} habe ich in {place} {setting} {act}.'
  F02: Ich wohne in {place}. {Date} habe ich {setting} {act}.
  F03: 'Eine Frage zu etwas, das ich {date} in {place} gemacht habe: Ich habe {setting} {act}.'
  F04: '{Date} war ich in {place} und habe {setting} {act}.'
  F05: Ich habe {date} in {place} {setting} {act}.
  F06: 'Folgendes ist passiert: {Date} habe ich in {place} {setting} {act}.'
  F07: '{Date} habe ich in {place} {setting} {act}. Das habe ich bewusst so gemacht.'
  F08: 'Kurz zu meiner Situation: {Date} habe ich in {place} {setting} {act}.'
