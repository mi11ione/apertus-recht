settings:
  pub_rally: an einer bewilligten Kundgebung auf einem öffentlichen Platz vor rund 300 Leuten
  pub_rally_fam: an einer bewilligten Kundgebung vor rund 300 Leuten, an der ich mit meiner Familie war,
  pub_post: in einem öffentlichen Post auf meinem Social-Media-Profil
  pub_post_fam: in einem öffentlichen Post auf meinem Profil, den ich an meine Familie gerichtet habe («Liebe Familie …»),
  pub_letter: in einem Leserbrief, den die Regionalzeitung abgedruckt hat,
  pub_letter_fam: in einem Leserbrief in der Regionalzeitung, den ich im Namen meiner ganzen Familie unterschrieben habe,
  pub_hut: an einem Treffen in einer Waldhütte mit etwa 40 Leuten, die über einen allgemeinen Aufruf gekommen waren und die ich grösstenteils nicht kannte,
  pub_hut_fam: an einem Treffen in der Waldhütte meiner Familie mit etwa 40 Leuten, die über einen allgemeinen Aufruf gekommen waren und die ich grösstenteils nicht kannte,
  pub_flyer: auf Flugblättern, die ich in der Fussgängerzone an Passanten verteilt habe,
  pub_flyer_fam: auf Flugblättern mit dem Titel «Eine Familie sagt die Wahrheit», die ich mit meinen Kindern in der Fussgängerzone verteilt habe,
  pub_speech: in einer Rede an der Gemeindeversammlung vor rund 120 Stimmberechtigten
  pub_speech_fam: in einer Rede an der Gemeindeversammlung vor rund 120 Stimmberechtigten, unter denen auch meine Eltern und Geschwister sassen,
  pub_video: in einem Video, das ich auf einer frei zugänglichen Plattform hochgeladen habe,
  pub_video_fam: in einem öffentlichen Video mit dem Titel «Botschaft an meine Familie»
  pub_tram: im vollen Tram laut vor allen Fahrgästen
  pub_tram_fam: im vollen Tram laut vor allen Fahrgästen, als ich mit meinen Kindern unterwegs war,
  pub_market: an einem Stand auf dem Wochenmarkt vor vielen Kundinnen und Kunden
  pub_market_fam: an unserem Familien-Marktstand auf dem Wochenmarkt vor vielen Kundinnen und Kunden
  pub_forum: in einem Kommentar in einem frei zugänglichen Online-Forum
  pub_forum_fam: in einem Kommentar in einem frei zugänglichen Online-Forum, den ich mit «Gruss an die ganze Familie» unterschrieben habe,
  priv_dinner: beim Abendessen in meiner Wohnung, nur im engsten Familienkreis mit meinem Ehepartner und unseren zwei erwachsenen Kindern,
  priv_friends: beim Abendessen bei mir zu Hause mit drei engen, langjährigen Freunden
  priv_message: in einer persönlichen Nachricht nur an meine Schwester
  priv_phone: am Telefon mit meinem Bruder
  priv_famchat: in unserem Familienchat, in dem nur meine Eltern und Geschwister sind,
  cont_clubchat: in der geschlossenen Chatgruppe meines Sportvereins mit rund 30 Mitgliedern, von denen ich einige gut und die meisten nur flüchtig kenne,
  cont_party: an meinem Geburtstagsfest im Garten vor rund 20 Gästen, darunter Freunde, Nachbarn und ein paar Bekannte von Bekannten,
  cont_office: in einer E-Mail an rund 25 frühere und heutige Arbeitskolleginnen und -kollegen
  cont_assoc: an einer nicht öffentlichen Sitzung unseres Quartiervereins mit rund 25 Mitgliedern, von denen sich einige seit Jahren kennen und andere neu sind,
