# German surface templates for Art. 261bis StGB scenarios. Slot ids are shared with design.yaml (which holds the legal
# facts) and with fr.yaml / it.yaml (translations). Placeholders:
#   {date} {place} {actor} {setting} {act}        slot surfaces; a capitalised name ({Date}, {Actor}, ...) capitalises
#                                                 the first letter.
#   {pron} {Pron} {poss_*} {spouse_*}             actor morphology (see `actors`).
#   {g.nom} {g.dat}                               case forms of the target group (accusative = nominative for every
#                                                 plural group phrase used here).
# Writing rules: no hateful wording, no slurs, no names of real persons; acts are described abstractly in the statute's
# own vocabulary; every scenario ends with intent stated, so intent is never the deciding element.
lang: de

frames:
  F01: "Sachverhalt: {Date} äusserte sich {actor} in {place} wie folgt: {setting} {act}. {Pron} handelte vorsätzlich."
  F02: "Sachverhalt: {Date} kam es in {place} zu folgendem Vorfall, an dem {actor} beteiligt war: {setting} {act}. {Pron} handelte vorsätzlich."
  F03: "Sachverhalt: {Actor} aus {place} steht unter folgendem Vorwurf: {setting} {act}, und zwar {date}. {Pron} handelte vorsätzlich."
  F04: "Sachverhalt: In {place} äusserte sich {actor} {date} wie folgt: {setting} {act}. Der Vorsatz ist unbestritten."
  F05: "Sachverhalt: {Date} hielt sich {actor} in {place} auf. {Setting} {act}. {Pron} handelte vorsätzlich."
  F06: "Sachverhalt: {Actor} lebt in {place}. {Date} geschah Folgendes: {setting} {act}. {Pron} wusste, was {pron} tat, und wollte es so."
  F07: "Sachverhalt: Gemäss Anklageschrift äusserte sich {actor} {date} in {place} wie folgt: {setting} {act}. {Pron} handelte vorsätzlich."
  F08: "Sachverhalt: {Date} ereignete sich in {place} ein Vorfall, an dem {actor} beteiligt war: {setting} {act}. Dass {pron} vorsätzlich handelte, ist erstellt."

