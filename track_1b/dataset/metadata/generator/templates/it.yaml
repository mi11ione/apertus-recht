acts:
  # cpv. 1 (incita all'odio o alla discriminazione)
  a1A1: "ha incitato all'odio contro {g.def}"
  a1A2: "ha incitato alla discriminazione contro {g.def}"
  a1B1: "ha esortato a odiare {g.def}"
  a1B2: "ha fomentato l'odio contro {g.def}"
  a1C1: "ha invitato a svantaggiare ed emarginare {g.def}"
  a1C2: "ha incitato a negare alloggi e posti di lavoro {g.a}"
  # cpv. 2 (propaga un'ideologia intesa a discreditare o calunniare sistematicamente)
  a2A1: "ha propagato un'ideologia intesa a discreditare sistematicamente {g.def}"
  a2A2: "ha diffuso scritti di una dottrina che discredita sistematicamente {g.def}"
  a2B1: "ha propagandato una visione del mondo secondo cui sono da considerare inferiori {g.def}"
  a2B2: "ha fatto propaganda per un'ideologia che mira a calunniare sistematicamente {g.def}"
  a2C1: "ha diffuso una dottrina che presenta sistematicamente come inferiori {g.def}"
  a2C2: "ha diffuso sistematicamente tesi secondo cui varrebbero meno degli altri esseri umani {g.def}"
  # cpv. 4 prima parte (discredita o discrimina in modo lesivo della dignità umana)
  a4A1: "ha discreditato in modo lesivo della dignità umana {g.def}"
  a4A2: "ha denigrato {g.def} in un modo che lede la dignità umana"
  a4B1: "ha descritto come esseri umani di minor valore {g.def}"
  a4B2: "ha vilipeso, con disprezzo per l'essere umano, {g.def}"
  a4C1: "ha negato il pari valore in quanto esseri umani {g.a}"
  a4C2: "ha definito esseri umani di seconda categoria {g.def}"

settings:
  # public
  pub_rally:      "durante una manifestazione autorizzata in una piazza pubblica davanti a circa 300 persone"
  pub_rally_fam:  "durante una manifestazione autorizzata in una piazza pubblica davanti a circa 300 persone, alla quale ha partecipato come «gita in famiglia» insieme a {spouse} e ai suoi figli"
  pub_post:       "in un post consultabile pubblicamente sul suo profilo sui social media"
  pub_post_fam:   "in un post consultabile pubblicamente sul suo profilo sui social media, rivolto alla sua famiglia («Cara famiglia, …») e letto anche dai suoi genitori e dai suoi fratelli"
  pub_letter:     "in una lettera alla redazione che è stata pubblicata su un giornale regionale"
  pub_letter_fam: "in una lettera alla redazione che è stata pubblicata su un giornale regionale e che ha firmato a nome di tutta la sua famiglia"
  pub_hut:        "durante una riunione in un rifugio forestale davanti a circa 40 partecipanti, che erano stati invitati tramite un appello generale e che per la maggior parte non conosceva personalmente"
  pub_hut_fam:    "durante una riunione in un rifugio forestale della sua famiglia davanti a circa 40 partecipanti, che erano stati invitati tramite un appello generale e che per la maggior parte non conosceva personalmente, alla presenza anche di {spouse} e dei suoi figli"
  pub_flyer:      "mediante volantini che ha distribuito ai passanti in una zona pedonale molto frequentata"
  pub_flyer_fam:  "mediante volantini che, insieme ai suoi figli, ha distribuito ai passanti in una zona pedonale molto frequentata e che ha intitolato «Una famiglia dice la verità»"
  pub_speech:     "in un discorso tenuto durante un'assemblea comunale davanti a circa 120 aventi diritto di voto"
  pub_speech_fam: "in un discorso tenuto durante un'assemblea comunale davanti a circa 120 aventi diritto di voto, tra i quali sedevano anche i suoi genitori e i suoi fratelli"
  pub_video:      "in un video che ha pubblicato su una piattaforma video liberamente accessibile"
  pub_video_fam:  "in un video che ha pubblicato su una piattaforma video liberamente accessibile e che ha intitolato «Messaggio alla mia famiglia»"
  pub_tram:       "in un tram gremito, ad alta voce e rivolgendosi a tutti i passeggeri"
  pub_tram_fam:   "in un tram gremito, ad alta voce e rivolgendosi a tutti i passeggeri, mentre era in giro con i suoi figli"
  pub_market:     "presso una bancarella in un mercato settimanale molto frequentato, davanti a numerosi clienti"
  pub_market_fam: "presso la bancarella che gestisce come azienda famigliare insieme ai suoi fratelli in un mercato settimanale molto frequentato, davanti a numerosi clienti"
  pub_forum:      "in un commento in un forum online liberamente accessibile"
  pub_forum_fam:  "in un commento in un forum online liberamente accessibile, che ha firmato con «Un saluto a tutta la famiglia»"
  # private (DTF 130 IV 111 consid. 5.2: cerchia famigliare, gruppo di amici, relazioni personali o particolare confidenza)
  priv_dinner:    "durante la cena nella più stretta cerchia famigliare, nel suo appartamento, alla sola presenza di {spouse} e dei suoi due figli adulti"
  priv_friends:   "durante una cena con tre amici stretti di lunga data nel suo appartamento"
  priv_message:   "in un messaggio personale che ha inviato soltanto a sua sorella"
  priv_phone:     "in una conversazione telefonica con suo fratello"
  priv_famchat:   "in una chat di famiglia di cui fanno parte soltanto i suoi genitori e i suoi fratelli"
  # contested: the facts that DTF 130 IV 111 consid. 5.2 makes decisive (relationships, number of people) are mixed
  cont_clubchat:  "in una chat di gruppo chiusa della sua società sportiva con circa 30 membri, di cui conosceva bene alcuni e la maggior parte solo superficialmente"
  cont_party:     "durante una festa di compleanno nel suo giardino davanti a circa 20 ospiti, tra cui amici, vicini e alcuni conoscenti di conoscenti"
  cont_office:    "in un'e-mail a circa 25 colleghi di lavoro, attuali ed ex"
  cont_assoc:     "durante una seduta non pubblica di un'associazione di quartiere con circa 25 membri, alcuni dei quali si conoscono da anni mentre altri vi hanno aderito solo di recente"
