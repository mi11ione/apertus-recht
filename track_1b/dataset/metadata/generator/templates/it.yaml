# Italian surface templates for Art. 261bis CP scenarios (Swiss legal register, terminology of the Italian CP text).
# Slot ids are shared with design.yaml (legal facts) and de.yaml / fr.yaml. Placeholders:
#   {date} {place} {actor} {setting} {act}        slot surfaces; a capitalised name ({Date}, {Actor}, {Setting}, ...)
#                                                 capitalises the first letter.
#   {espresso} {coinvolto} {accusato} {spouse}    actor morphology (participle agreement, spouse); see `morphology`.
#                                                 Italian possessives agree with the possessed noun, not the possessor,
#                                                 so suo/sua/suoi need no actor morphology; only the spouse noun does.
#   {g.def} {g.di} {g.a}                          target group: definite form, with articulated "di", with
#                                                 articulated "a". Every group phrase carries "a causa del/della loro
#                                                 <characteristic>".
# Mechanics: settings never end with a comma; every frame joins them as "{setting}, {act}". Acts start with the verb in
# the passato prossimo and are pro-drop (the subject is the actor named in the frame).
# Writing rules: no hateful wording, no slurs, no names of real persons; acts are described abstractly in the statute's
# own vocabulary; every scenario ends with intent stated, so intent is never the deciding element.
lang: it

# Post-render rewrites (regex, replacement), applied in order: euphonic "ad" before a-initial words.
rewrite:
  - ['\ba (?=[Aa])', 'ad ']

frames:
  F01: "Fatti: {Date} {actor} si è {espresso} a {place} come segue: {setting}, {act}. Ha agito intenzionalmente."
  F02: "Fatti: {Date} a {place} si è verificato il seguente episodio, che ha visto {coinvolto} {actor}: {setting}, {act}. Ha agito intenzionalmente."
  F03: "Fatti: {Actor} di {place} è {accusato} di quanto segue: {setting}, {act}, e precisamente {date}. Ha agito intenzionalmente."
  F04: "Fatti: A {place} {actor} si è {espresso} {date} come segue: {setting}, {act}. L'intenzione non è contestata."
  F05: "Fatti: {Date} {actor} si trovava a {place}. {Setting}, {act}. Ha agito intenzionalmente."
  F06: "Fatti: {Actor} vive a {place}. {Date} è accaduto quanto segue: {setting}, {act}. Sapeva ciò che stava facendo e voleva farlo."
  F07: "Fatti: Secondo l'atto d'accusa, {date} {actor} si è {espresso} a {place} come segue: {setting}, {act}. Ha agito intenzionalmente."
  F08: "Fatti: {Date} a {place} si è verificato un episodio in cui era {coinvolto} {actor}: {setting}, {act}. È accertato che ha agito intenzionalmente."

actors:
  m1: {surface: "un uomo", gender: m}
  m2: {surface: "un pensionato", gender: m}
  m3: {surface: "un imprenditore", gender: m}
  m4: {surface: "uno studente", gender: m}
  f1: {surface: "una donna", gender: f}
  f2: {surface: "una pensionata", gender: f}
  f3: {surface: "un'imprenditrice", gender: f}
  f4: {surface: "una studentessa", gender: f}

morphology:
  m: {espresso: espresso, coinvolto: coinvolto, accusato: accusato, spouse: "sua moglie"}
  f: {espresso: espressa, coinvolto: coinvolta, accusato: accusata, spouse: "suo marito"}

