acts:
  # Abs. 1 (al. 1): incitation à la haine ou à la discrimination
  a1A1: "{pron} a incité à la haine envers {g.def}"
  a1A2: "{pron} a incité à la discrimination envers {g.def}"
  a1B1: "{pron} a appelé à haïr {g.def}"
  a1B2: "{pron} a attisé la haine contre {g.def}"
  a1C1: "{pron} a préconisé de défavoriser et d'exclure {g.def}"
  a1C2: "{pron} a exhorté à refuser des logements et des emplois {g.a}"
  # Abs. 2 (al. 2): propagation d'une idéologie de dénigrement systématique
  a2A1: "{pron} a propagé une idéologie visant à rabaisser de façon systématique {g.def}"
  a2A2: "{pron} a diffusé les écrits d'une doctrine qui rabaisse systématiquement {g.def}"
  a2B1: "{pron} a promu une vision du monde qui assigne un rang inférieur {g.a}"
  a2B2: "{pron} a fait la promotion d'une idéologie qui a pour but de dénigrer systématiquement {g.def}"
  a2C1: "{pron} a diffusé une doctrine qui présente systématiquement comme des êtres inférieurs {g.def}"
  a2C2: "{pron} a diffusé systématiquement des thèses présentant comme moins dignes que les autres êtres humains {g.def}"
  # Abs. 4 (al. 4, 1re phrase): abaissement contraire à la dignité humaine
  a4A1: "{pron} a abaissé d'une façon qui porte atteinte à la dignité humaine {g.def}"
  a4A2: "{pron} a dévalorisé {g.def} d'une manière contraire à la dignité humaine"
  a4B1: "{pron} a présenté comme des êtres humains de moindre valeur {g.def}"
  a4B2: "{pron} a dénigré {g.def} en leur déniant toute dignité humaine"
  a4C1: "{pron} a nié la dignité humaine {g.de}"
  a4C2: "{pron} a qualifié d'êtres humains de seconde zone {g.def}"
  # A18 (famille DIGNITY uniquement)
  a4D_deg: "{pron} a traité {g.who} de vermine et leur a dénié, en raison de leur foi, la qualité d'êtres humains égaux"
  a4D_bord: "{pron} a fait une plaisanterie grossière, dont la teneur ne ressort pas des faits, visant {g.who} ; des personnes présentes l'ont qualifiée de « déplacée »"
  a4D_crit1: "{pron} a reproché aux communautés et aux associations {g.rel} de refuser toute réforme"
  a4D_crit2: "{pron} a critiqué l'opacité des finances des institutions {g.rel} et exigé leur pleine transparence"
  a4D_crit3: "{pron} a jugé dépassées les prescriptions des enseignements {g.rel} sur le rôle des femmes"
  a4D_crit4: "{pron} a affirmé que l'enseignement religieux {g.rel} n'a pas sa place dans les écoles publiques"

settings:
  # public
  pub_rally:      "lors d'une manifestation autorisée qui se tenait sur une place publique devant environ 300 personnes"
  pub_rally_fam:  "lors d'une manifestation autorisée qui se tenait sur une place publique devant environ 300 personnes et à laquelle {pron} assistait en « sortie familiale » avec {spouse} et ses enfants"
  pub_post:       "dans une publication consultable publiquement sur son profil de réseau social"
  pub_post_fam:   "dans une publication consultable publiquement sur son profil de réseau social, publication qu'{pron} a adressée à sa famille (« Chère famille, … ») et que lisent aussi ses parents et ses frères et sœurs"
  pub_letter:     "dans une lettre de lecteur parue dans un journal régional"
  pub_letter_fam: "dans une lettre de lecteur parue dans un journal régional et qu'{pron} a signée au nom de toute sa famille"
  pub_hut:        "lors d'une réunion dans un refuge forestier devant environ 40 participants, qui avaient été invités par un appel général et dont {pron} ne connaissait pas personnellement la plupart"
  pub_hut_fam:    "lors d'une réunion dans un refuge forestier de sa famille devant environ 40 participants, qui avaient été invités par un appel général et dont {pron} ne connaissait pas personnellement la plupart, {spouse} et ses enfants étant également présents"
  pub_flyer:      "sur des tracts qu'{pron} a distribués aux passants dans une zone piétonne animée"
  pub_flyer_fam:  "sur des tracts qu'{pron} a distribués avec ses enfants aux passants dans une zone piétonne animée et qu'{pron} a intitulés « Une famille dit la vérité »"
  pub_speech:     "dans un discours prononcé lors d'une séance publique d'information de la commune devant environ 120 personnes"
  pub_speech_fam: "dans un discours prononcé lors d'une séance publique d'information de la commune devant environ 120 personnes, parmi lesquelles se trouvaient aussi ses parents et ses frères et sœurs"
  pub_video:      "dans une vidéo qu'{pron} a publiée sur une plateforme vidéo librement accessible"
  pub_video_fam:  "dans une vidéo qu'{pron} a publiée sur une plateforme vidéo librement accessible et qu'{pron} a intitulée « Message à ma famille »"
  pub_tram:       "dans un bus bondé, à haute voix et en s'adressant à tous les passagers"
  pub_tram_fam:   "dans un bus bondé, à haute voix et en s'adressant à tous les passagers, alors qu'{pron} se déplaçait avec ses enfants"
  pub_market:     "à un stand sur un marché hebdomadaire très fréquenté, devant une nombreuse clientèle"
  pub_market_fam: "au stand qu'{pron} tient en entreprise familiale avec ses frères et sœurs sur un marché hebdomadaire très fréquenté, devant une nombreuse clientèle"
  pub_forum:      "dans un commentaire publié sur un forum en ligne librement accessible"
  pub_forum_fam:  "dans un commentaire publié sur un forum en ligne librement accessible et qu'{pron} a signé de la formule « Salutations à toute la famille »"
  # private (ATF 130 IV 111 consid. 5.2: cercle familial ou d'amis, relations personnelles ou confiance particulière)
  priv_dinner:    "lors d'un repas du soir dans le cercle familial le plus étroit, dans son appartement, en présence uniquement de {spouse} et de ses deux enfants adultes"
  priv_friends:   "lors d'un repas du soir avec trois amis proches de longue date, dans son appartement"
  priv_message:   "dans un message personnel qu'{pron} a envoyé uniquement à sa sœur"
  priv_phone:     "lors d'une conversation téléphonique avec son frère"
  priv_famchat:   "dans un groupe de discussion familial dont seuls ses parents et ses frères et sœurs sont membres"
  # contested: the facts that ATF 130 IV 111 consid. 5.2 makes decisive (relationships, number of people) are mixed
  cont_clubchat:  "dans un groupe de discussion fermé réunissant environ 30 membres de son club sportif, dont {pron} connaissait quelques-uns personnellement et la plupart seulement de loin"
  cont_party:     "lors d'une fête d'anniversaire dans son jardin, devant environ 20 invités, parmi lesquels des amis, des voisins et quelques connaissances de connaissances"
  cont_office:    "dans un courriel adressé à quelque 25 collègues de travail, anciens et actuels"
  cont_assoc:     "lors d'une séance non publique d'une association de quartier comptant environ 25 membres, dont certains se connaissent depuis des années et d'autres n'ont adhéré que récemment"
