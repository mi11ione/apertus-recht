# French (Swiss legal register) surface templates for Art. 261bis StGB (art. 261bis CP) scenarios. Translated from
# templates/de.yaml (same ids; legal facts in design.yaml). Placeholders:
#   {date} {place} {actor} {setting} {act}        slot surfaces; a capitalised name ({Date}, {Actor}, {Setting}, ...)
#                                                 capitalises the first letter.
#   {pron} {Pron} {e} {spouse}                    actor morphology (see `morphology`): subject pronoun il/elle,
#                                                 past-participle agreement "" / "e", spouse "son épouse" / "son mari".
#                                                 French possessives (son/sa/ses) agree with the possessed noun, not
#                                                 with the actor, so they are written out in the settings.
#   {g.def} {g.de} {g.a}                          forms of the target group: les ... / des ... / aux ... (contractions
#                                                 of de + les and à + les are spelled out per group).
# Comma rule: settings carry no leading or trailing comma; frames join them as "{setting}, {act}". Settings start in
# lower case (they follow a colon); F05, where the setting opens a sentence, uses {Setting}.
# Writing rules as in de.yaml: no hateful wording, no slurs, no names of real persons; acts use the statute's own
# vocabulary (family A) or neutral paraphrases (families B, C); every scenario ends with intent stated.
lang: fr

frames:
  F01: "Faits : {Date}, {actor} s'est exprimé{e} comme suit à {place} : {setting}, {act}. {Pron} a agi intentionnellement."
  F02: "Faits : D'après le rapport de police, {date}, à {place}, {actor} s'est exprimé{e} comme suit : {setting}, {act}. {Pron} a agi intentionnellement."
  F03: "Faits : {Actor} domicilié{e} à {place} se voit reprocher ce qui suit : {setting}, {act}, et ce {date}. {Pron} a agi intentionnellement."
  F04: "Faits : À {place}, {date}, {actor} s'est exprimé{e} comme suit : {setting}, {act}. L'intention n'est pas contestée."
  F05: "Faits : {Date}, {actor} se trouvait à {place}. {Setting}, {act}. {Pron} a agi intentionnellement."
  F06: "Faits : {Date}, {actor} domicilié{e} à {place} s'est exprimé{e} comme suit : {setting}, {act}. {Pron} a agi avec conscience et volonté."
  F07: "Faits : Selon l'acte d'accusation, {date}, à {place}, {actor} s'est exprimé{e} comme suit : {setting}, {act}. {Pron} a agi intentionnellement."
  F08: "Faits : {Date}, à {place}, {actor} s'est exprimé{e} comme suit : {setting}, {act}. Il est établi qu'{pron} a agi intentionnellement."

