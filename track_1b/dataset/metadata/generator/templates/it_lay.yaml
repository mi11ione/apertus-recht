# Italian, in the voice of a user asking about their own conduct (A16): the same scenarios and facts as it.yaml,
# told in the first person and in everyday words, like de_lay.yaml. No statute formulas; the act is described concretely
# enough that the dignity threshold is met; the group is named without its characteristic; intent only in F07.
lang: it_lay
frames:
  F01: '{Date} a {place}, {setting}, ho {act}.'
  F02: Abito a {place}. {Date}, {setting}, ho {act}.
  F03: 'Una domanda su una cosa che ho fatto {date} a {place}: {setting}, ho {act}.'
  F04: '{Date} ero a {place} e, {setting}, ho {act}.'
  F05: Ho {act} {date} a {place}, {setting}.
  F06: 'Ecco cosa è successo: {date} a {place}, {setting}, ho {act}.'
  F07: '{Date} a {place}, {setting}, ho {act}. L''ho fatto di proposito.'
  F08: 'Per spiegare la mia situazione: {date} a {place}, {setting}, ho {act}.'
