settings:
  pub_rally: durante una manifestazione autorizzata in una piazza pubblica, davanti a circa 300 persone
  pub_rally_fam: durante una manifestazione autorizzata davanti a circa 300 persone, a cui partecipavo con la mia famiglia
  pub_post: in un post pubblico sul mio profilo social
  pub_post_fam: in un post pubblico sul mio profilo, rivolto alla mia famiglia («Cara famiglia, …»)
  pub_letter: in una lettera che il giornale regionale ha pubblicato
  pub_letter_fam: in una lettera pubblicata sul giornale regionale, firmata a nome di tutta la mia famiglia
  pub_hut: durante una riunione in un rifugio forestale con una quarantina di persone arrivate tramite un appello generale, che per lo più non conoscevo
  pub_hut_fam: durante una riunione nel rifugio forestale della mia famiglia con una quarantina di persone arrivate tramite un appello generale, che per lo più non conoscevo
  pub_flyer: su volantini che ho distribuito ai passanti nella zona pedonale
  pub_flyer_fam: su volantini intitolati «Una famiglia dice la verità», che ho distribuito con i miei figli nella zona pedonale
  pub_speech: in un discorso durante una serata informativa pubblica del Comune, davanti a circa 120 persone
  pub_speech_fam: in un discorso durante una serata informativa pubblica del Comune, davanti a circa 120 persone, tra cui i miei genitori e i miei fratelli
  pub_video: in un video che ho caricato su una piattaforma liberamente accessibile
  pub_video_fam: in un video pubblico intitolato «Messaggio alla mia famiglia»
  pub_tram: in un autobus pieno, ad alta voce, davanti a tutti i passeggeri
  pub_tram_fam: in un autobus pieno, ad alta voce, davanti a tutti i passeggeri, mentre ero con i miei figli
  pub_market: alla bancarella del mercato settimanale, davanti a molti clienti
  pub_market_fam: alla nostra bancarella di famiglia al mercato settimanale, davanti a molti clienti
  pub_forum: in un commento in un forum online liberamente accessibile
  pub_forum_fam: in un commento in un forum online liberamente accessibile, firmato «Un saluto a tutta la famiglia»
  priv_dinner: durante una cena a casa mia, solo con la famiglia più stretta, cioè {spouse} e i nostri due figli adulti
  priv_friends: durante una cena a casa mia con tre amici stretti di lunga data
  priv_message: in un messaggio personale inviato soltanto a mia sorella
  priv_phone: al telefono con mio fratello
  priv_famchat: nella nostra chat di famiglia, di cui fanno parte solo i miei genitori e i miei fratelli
  cont_clubchat: nella chat di gruppo chiusa della mia società sportiva, una trentina di membri di cui conosco bene alcuni e la maggior parte solo di vista
  cont_party: alla mia festa di compleanno in giardino, davanti a una ventina di ospiti, tra cui amici, vicini e alcuni conoscenti di conoscenti
  cont_office: in un'e-mail a circa 25 colleghi di lavoro, attuali ed ex
  cont_assoc: durante una seduta non pubblica della nostra associazione di quartiere, circa 25 membri, alcuni dei quali si conoscono da anni e altri sono nuovi
