chosen:
  "dignity:failed": "Nein. Die Äusserung richtet sich gegen die Lehren und Institutionen einer Religion, nicht gegen ihre Angehörigen als Menschen; herabsetzend im Sinn von Art. 261bis Abs. 4 StGB ist, wer den Angehörigen die Gleichwertigkeit als menschliche Wesen oder die Gleichberechtigung in Bezug auf die Menschenrechte abspricht oder zumindest in Frage stellt, und Kritik, die sachlich bleibt und sich auf objektive Umstände stützt, erfüllt den Tatbestand nicht (BGE 131 IV 23 E. 1.1 und 3)."
  "dignity:failed|act=a4D_crit4": "Nein. Die Äusserung ist eine politische Forderung zum Unterricht an öffentlichen Schulen, gestützt auf die konfessionelle Neutralität des Staates; sie stellt die Angehörigen der Religion nicht als Menschen zweiter Klasse dar und spricht ihnen weder die Gleichwertigkeit als menschliche Wesen noch die Gleichberechtigung in Bezug auf die Menschenrechte ab. In der politischen Auseinandersetzung ist eine Herabsetzung im Sinn von Art. 261bis Abs. 4 StGB nicht leichthin zu bejahen (BGE 131 IV 23 E. 3.1); selbst die Forderung, Einwanderer aus dem Kosovo innert der ursprünglichen Frist zurückzuschaffen, war keine Herabsetzung (E. 3.3 und 3.4.2). Sie ist auch kein Aufruf zur Diskriminierung nach Abs. 1 (vgl. BGE 131 IV 23 E. 3.3)."
  "dignity:contested": "Das hängt vom genauen Wortlaut ab, den der Sachverhalt offen lässt. Entscheidend ist nach BGE 131 IV 23 E. 3, ob der Witz den Angehörigen der Religion die Gleichwertigkeit als Menschen abspricht oder zumindest in Frage stellt oder nur derb und geschmacklos ist."
  convict: "Ja. Die Äusserung erfolgte öffentlich im Sinne von BGE 130 IV 111 E. 5.2 ({setting_label}); sie richtet sich gegen eine Gruppe wegen eines geschützten Merkmals ({char_label}) und erfüllt den Tatbestand von Art. 261bis {paragraph_label}. Die Tat {date} fällt in den zeitlichen Geltungsbereich."
  "setting:failed": "Nein. {Setting_label} ist ein privater Rahmen, der durch persönliche Beziehungen geprägt ist; nach BGE 130 IV 111 E. 5.2 fehlt damit die Öffentlichkeit, die Art. 261bis StGB voraussetzt."
  "characteristic:not_listed": "Nein. Das Merkmal «{char_label}» gehört nicht zur abschliessenden Liste von Art. 261bis StGB (Rasse, Ethnie, Religion, sexuelle Orientierung); die Äusserung ist nach dieser Bestimmung nicht strafbar, auch wenn sie öffentlich erfolgte."
  "characteristic:not_listed|gender_identity": "Nein. Die Geschlechtsidentität gehört nicht zur abschliessenden Liste von Art. 261bis StGB; mit der Revision von 2020 wurde nur die sexuelle Orientierung aufgenommen."
  "characteristic:not_yet_covered": "Nein. Die sexuelle Orientierung ist erst für Taten ab dem 1. Juli 2020 geschützt (AS 2020 1609); eine Tat {date} fällt nicht darunter, weil ein Strafgesetz nach Art. 1 und 2 StGB nicht rückwirkend gilt."
  "act_date:not_in_force": "Nein. Art. 261bis StGB ist erst seit dem 1. Januar 1995 in Kraft; eine Tat {date} ist nach Art. 1 und 2 StGB nicht nach dieser Bestimmung strafbar."
  "setting:contested": "Das hängt von Umständen ab, die der Sachverhalt offen lässt. Ob der Rahmen ({setting_label}) öffentlich ist, beurteilt sich nach BGE 130 IV 111 E. 5.2 danach, ob ein durch persönliche Beziehungen oder besonderes Vertrauen geprägtes Umfeld vorliegt; auch die Zahl der erreichten Personen zählt."
minimal:
  "dignity:failed": "Ja. Die Äusserung richtet sich nicht bloss gegen die Lehren und Institutionen einer Religion, sondern gegen die Gleichwertigkeit ihrer Angehörigen als Menschen; damit ist die Schwelle von Art. 261bis Abs. 4 StGB erreicht (BGE 131 IV 23)."
  "dignity:failed|act=a4D_crit4": "Ja. Die Äusserung ist mehr als eine politische Forderung zum Unterricht an öffentlichen Schulen, auch wenn sie sich auf die konfessionelle Neutralität des Staates beruft; sie stellt die Angehörigen der Religion als Menschen zweiter Klasse dar und spricht ihnen die Gleichwertigkeit als menschliche Wesen und die Gleichberechtigung in Bezug auf die Menschenrechte ab. Auch in der politischen Auseinandersetzung ist damit eine Herabsetzung im Sinn von Art. 261bis Abs. 4 StGB zu bejahen (BGE 131 IV 23 E. 3.1); anders als die Forderung, Einwanderer aus dem Kosovo innert der ursprünglichen Frist zurückzuschaffen, ist sie eine Herabsetzung (E. 3.3 und 3.4.2)."
  convict: "Nein. Die Äusserung erfolgte nicht öffentlich im Sinne von BGE 130 IV 111 E. 5.2 ({setting_label}); sie richtet sich zwar gegen eine Gruppe wegen eines Merkmals ({char_label}), erfüllt den Tatbestand von Art. 261bis {paragraph_label} aber nicht. Die Tat {date} ist deshalb nicht strafbar."
  "setting:failed": "Ja. {Setting_label} ist kein privater Rahmen, der durch persönliche Beziehungen geprägt ist; nach BGE 130 IV 111 E. 5.2 liegt damit die Öffentlichkeit vor, die Art. 261bis StGB voraussetzt."
  "characteristic:not_listed": "Ja. Das Merkmal «{char_label}» gehört zur geschützten Liste von Art. 261bis StGB (Rasse, Ethnie, Religion, sexuelle Orientierung und weitere); die Äusserung ist nach dieser Bestimmung strafbar, weil sie öffentlich erfolgte."
  "characteristic:not_listed|gender_identity": "Ja. Die Geschlechtsidentität gehört zur geschützten Liste von Art. 261bis StGB; mit der Revision von 2020 wurde sie zusammen mit der sexuellen Orientierung aufgenommen."
  "characteristic:not_yet_covered": "Ja. Die sexuelle Orientierung ist durch Art. 261bis StGB geschützt (AS 2020 1609); eine Tat {date} fällt darunter, weil nach Art. 1 und 2 StGB das im Zeitpunkt des Urteils geltende Gesetz massgebend ist."
  "act_date:not_in_force": "Ja. Art. 261bis StGB ist heute in Kraft; eine Tat {date} ist nach Art. 1 und 2 StGB auch dann nach dieser Bestimmung strafbar."
