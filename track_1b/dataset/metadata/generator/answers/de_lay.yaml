# A17/A19: case-specific (looked up as <reason>|<characteristic>, <reason>, verdict); not part of the scored `chosen` answer
scope_note:
  "setting:contested": "Ob das strafbar ist, hängt davon ab, ob der Rahmen öffentlich war: wie die Anwesenden zueinander stehen und wie viele es sind (BGE 130 IV 111). Im eigenen Fall hilft eine Anwältin oder ein Anwalt."
  "convict": "Das ist eine Einschätzung nach der Schilderung, keine Rechtsberatung: Ein Gericht prüft zudem Vorsatz, Beweislage und die Umstände. Im eigenen Fall hilft eine Anwältin oder ein Anwalt."
  "open": "Ob das strafbar ist, hängt von Umständen ab, die die Schilderung offenlässt (genauer Wortlaut, Zusammenhang). Im eigenen Fall hilft eine Anwältin oder ein Anwalt."
  "acquit": "«Nicht strafbar nach Art. 261bis StGB» heisst nicht folgenlos: Ist eine bestimmte oder bestimmbare Person betroffen, sind eine Ehrverletzung (Art. 173 ff. StGB) oder eine Persönlichkeitsverletzung (Art. 28 ZGB) möglich, am Arbeitsplatz oder im Mietverhältnis auch arbeits- oder mietrechtliche Folgen."
  "characteristic:not_yet_covered": "Art. 261bis galt für diese Tat noch nicht; Ehrverletzungen aus dieser Zeit wären heute verjährt (vier Jahre, Art. 178 StGB). Ist die Äusserung noch online und betrifft sie eine bestimmte Person, kann diese zivilrechtlich dagegen vorgehen (Art. 28 ZGB)."
  "act_date:not_in_force": "Art. 261bis galt für diese Tat noch nicht; andere in Frage kommende Äusserungsdelikte (etwa Ehrverletzungen, Art. 178 StGB) wären heute verjährt."
  "dignity:failed": "Sachliche Kritik an einer Religion und ihren Institutionen ist durch die Meinungsfreiheit geschützt (Art. 16 BV, Art. 10 EMRK). Bei Äusserungen erfasst Art. 261 StGB erst, wer die Glaubensüberzeugung anderer öffentlich und in gemeiner Weise beschimpft oder verspottet."
