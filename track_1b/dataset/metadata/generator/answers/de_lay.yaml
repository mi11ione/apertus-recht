# Reference answers for the user-voice items: the German answers (de.yaml), unchanged except `scope_note`, which addresses the speaker (A19).
# Reference answers (to the R0 "verurteilen?" question), specific to each item. `chosen` is the answer the law supports;
# `rejected` is a wrong answer of the kind the twin is built to catch, phrased as the arguments models actually give.
# Keys: <deciding_element>:<reason_code> from the gold engine, optionally refined by value ("<key>|<value>") or, most
# specific, by the act ("<key>|act=<act id>", A22), or
# `convict`; `traps` replace the generic rejected answer of a convict item that carries the trap. A list gives variants;
# one is chosen deterministically per item. Placeholders: {char_label}, {date}, {setting_label}, {paragraph_label};
# capitalised forms ({Setting_label}) capitalise the first letter.
