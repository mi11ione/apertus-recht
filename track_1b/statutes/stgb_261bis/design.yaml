# Family filters: {slot: filter}. A filter is a dict of attribute tests:
#   tags: [..]      value carries all listed tags        not_tags: [..]  value carries none of them
#   <attr>: null    attribute absent                     <attr>: base    attribute equals the base value's id (or attr)
#   match: [attrs]  same attribute value as the base     differ: [attrs] different attribute value from the base
# Slots not named in `base` are drawn from all values (balanced). Each variant changes exactly the one named slot.
families:
  SET:
    title: public vs private setting (BGE 130 IV 111 E. 5.2), with a family-worded public placebo
    groups: 55
    base:
      setting: {tags: [public], placebo_of: null}
      group:   {tags: [protected], synonym_of: null}
      date:    {tags: [recent]}
    variants:
      - {slot: setting, filter: {tags: [private]}, expect: true_flip}
      - {slot: setting, filter: {placebo_of: base}, expect: placebo}
  CHAR:
    title: closed list (protected vs not covered), with a synonym placebo
    groups: 60
    base:
      setting: {tags: [public], placebo_of: null}
      group:   {tags: [protected], synonym_of: null}
      date:    {tags: [recent]}
    variants:
      - {slot: group, filter: {tags: [unprotected]}, expect: true_flip}
      - {slot: group, filter: {synonym_of: base}, expect: placebo}
  CHARX:
    title: closed list without a synonym (bases whose group has no synonym form)
    groups: 20
    base:
      setting: {tags: [public], placebo_of: null}
      group:   {tags: [protected], synonym_of: null}
      date:    {tags: [recent]}
    variants:
      - {slot: group, filter: {tags: [unprotected]}, expect: true_flip}
      - {slot: group, filter: {tags: [unprotected]}, expect: true_flip}
  DATE_SO:
    title: sexual orientation before / after the 1 Jul 2020 extension (AS 2020 1609, Art. 2 StGB)
    groups: 35
    base:
      setting: {tags: [public], placebo_of: null}
      group:   {tags: [so], synonym_of: null}
      date:    {tags: [recent]}
    variants:
      - {slot: date, filter: {tags: [pre2020]}, expect: true_flip}
      - {slot: date, filter: {tags: [post2020, boundary]}, expect: placebo}
  DATE_CTRL:
    title: over-application control - characteristics covered since 1995 keep their protection before 2020; acts before 1995 are not punishable
    groups: 25
    base:
      setting: {tags: [public], not_tags: [online], placebo_of: null}   # no online settings before 1995
      group:   {tags: [since1995], synonym_of: null}
      date:    {tags: [recent]}
    variants:
      - {slot: date, filter: {tags: [pre2020]}, expect: placebo, trap: date_overapplied}
      - {slot: date, filter: {tags: [pre1995]}, expect: true_flip}
  CONTESTED:
    title: fact-dependent publicity (open under BGE 130 IV 111 E. 5.2), with a family-worded public placebo
    groups: 15
    base:
      setting: {tags: [public], placebo_of: null}
      group:   {tags: [protected], synonym_of: null}
      date:    {tags: [recent]}
    variants:
      - {slot: setting, filter: {tags: [contested]}, expect: contested}
      - {slot: setting, filter: {placebo_of: base}, expect: placebo}
  WORDING:
    title: wording invariance - same paragraph in another wording family, and another paragraph
    groups: 10
    base:
      setting: {tags: [public], placebo_of: null}
      group:   {tags: [protected], synonym_of: null}
      date:    {tags: [recent]}
    variants:
      - {slot: act, filter: {match: [paragraph], differ: [family]}, expect: placebo}
      - {slot: act, filter: {differ: [paragraph]}, expect: placebo}

# held-out wording family for the pre-registered read-back test (fit on A+B, predict C)
heldout_wording_family: C
