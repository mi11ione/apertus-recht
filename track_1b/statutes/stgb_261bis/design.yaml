  group:
    values:
      race_black:     {facts: {characteristic: race}, tags: [protected, since1995]}
      race_african:   {facts: {characteristic: race}, tags: [protected, since1995]}
      race_asian:     {facts: {characteristic: race}, tags: [protected, since1995]}
