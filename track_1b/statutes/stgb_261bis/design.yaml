      pub_rally:      {facts: {setting: public}, tags: [public, crowd]}
      pub_rally_fam:  {facts: {setting: public}, tags: [public, family_wording], placebo_of: pub_rally, trap: family_wording}
      pub_post:       {facts: {setting: public}, tags: [public, online]}
