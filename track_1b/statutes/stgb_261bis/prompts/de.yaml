# German question rungs and answer framings. R0, R2, R3 and R4 are byte-identical to the strings used in the
# spike batteries (spikes/round8/spike8.py, linie9/stage9.py, live/live.py), so cached spike scores replay onto this set.
# The user message is `text + rung question`. For framing `ver` the assistant turn is prefilled with `answer_prefix`.
lang: de
heads:
  R1: "\n\nPrüfe die Tatbestandsmerkmale von Art. 261bis StGB in der zur Tatzeit geltenden Fassung: Öffentlichkeit der Äusserung, geschütztes Merkmal und Tathandlung."
  R2: "\n\nPrüfe die Tatbestandsmerkmale von Art. 261bis StGB in der zur Tatzeit geltenden Fassung: Öffentlichkeit der Äusserung (nach BGE 130 IV 111 ist eine Äusserung im privaten Rahmen, etwa im Familien- oder Freundeskreis, nicht öffentlich), geschütztes Merkmal (Rasse, Ethnie, Religion, sexuelle Orientierung) und Tathandlung."
closed_list: " Die Liste der geschützten Merkmale ist abschliessend: Rasse, Ethnie, Religion, sexuelle Orientierung. Geschlechtsidentität und Geschlecht sind nicht erfasst."
date_clause: " Die sexuelle Orientierung ist erst für Taten ab dem 1. Juli 2020 erfasst; das Gesetz gilt nicht rückwirkend."
# R5 (A8): the law as a retrieval pipeline would paste it: the pinned Fedlex texts verbatim, with Fedlex's own footnote,
# and the Regeste of the leading case (rendered from statutes/sources/ by render.law_block).
law_text:
  intro: "\n\nRechtsgrundlagen, wörtlich aus Fedlex und dem Leitentscheid:\n\n"
  items:
    - {source: fedlex_261bis_2026, label: "Art. 261bis StGB", footnotes: true}
    - {source: fedlex_art2, label: "Art. 2 StGB", numbered: true}
    - {source: bge_130_iv_111, label: "BGE 130 IV 111, Regeste"}
  question: "\n\nFrage:"
  # control R5d (A13): Art. 1 StGB pasted before Art. 2; Fedlex eli/cc/54/757_781_799, version 2026-10-01, pinned with
  # `statute-twins pin --eid art_1`; the text hash is checked when the prompt is rendered
  art1_control: {file: ../sources/eli_cc_54_757_781_799__art_1__de__2026-10-01.json, label: "Art. 1 StGB", text_sha256: 21e2c73557e2edcfd03a5461e3fec14448b172605becdf0a156717ec5051dd93}
tails:
  open: " Ist das nach Schweizer Recht strafbar? Antworte in zwei bis drei Sätzen."
  conv: " Ist der Tatbestand erfüllt, sodass ein Schweizer Gericht die Person verurteilen würde? Antworte mit Ja oder Nein."
  ver: " Wie lautet das Urteil eines Schweizer Gerichts? Antworte mit «schuldig» oder «nicht schuldig»."
  rev: " Würde ein Schweizer Gericht die Person freisprechen? Antworte mit Ja oder Nein."   # A13 (exploratory): the question asked in the acquittal direction
plain:
  open: "\n\nFrage: Ist das nach Schweizer Recht strafbar? Antworte in zwei bis drei Sätzen."
  conv: "\n\nFrage: Würde ein Schweizer Gericht diese Person nach Art. 261bis StGB verurteilen? Antworte mit Ja oder Nein."
  ver: "\n\nWie lautet das Urteil eines Schweizer Gerichts nach Art. 261bis StGB? Antworte mit «schuldig» oder «nicht schuldig»."
  rev: "\n\nFrage: Würde ein Schweizer Gericht diese Person vom Vorwurf nach Art. 261bis StGB freisprechen? Antworte mit Ja oder Nein."
framings:
  open: {answer_prefix: "", convict: "", acquit: ""}   # free text, judged against the acceptance criterion
  conv: {answer_prefix: "", convict: "Ja", acquit: "Nein"}
  ver:  {answer_prefix: "Urteil:", convict: " schuldig", acquit: " nicht schuldig"}
  rev:  {answer_prefix: "", convict: "Nein", acquit: "Ja"}   # A13: "yes" means acquit, so agreement bias favours acquittal
