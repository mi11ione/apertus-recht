# Elements are checked in this order; the first element that fails decides the verdict (the "deciding element").
# Values marked `contested` make the verdict "open" unless another element fails outright.
elements:
  - id: act_date
    kind: date
    label: {de: Tatzeitpunkt, fr: date de l'acte, it: data dell'atto}
    in_force_from: 1995-01-01
    authority: [fedlex_art2, as_1994_2887]
    fail_reason: >-
      The act predates the entry into force of Art. 261bis (1 Jan 1995); Art. 2 StGB excludes retroactive punishment.

  - id: characteristic
    kind: covered_set
    label: {de: geschütztes Merkmal, fr: critère protégé, it: criterio protetto}
    depends_on: act_date
    # `anchor`: the statutory term for the value. tests/test_sources.py checks that every value covered on a
    # consolidation's date appears in that consolidation's text and that every uncovered value does not.
    authority: [fedlex_261bis_2026, fedlex_261bis_2020, fedlex_art2]
    values:
      race:               {covered_from: 1995-01-01, authority: [fedlex_261bis_2020, fedlex_261bis_2026], anchor: {de: "Rasse", fr: "raciale", it: "razza"}}
      ethnicity:          {covered_from: 1995-01-01, authority: [fedlex_261bis_2020, fedlex_261bis_2026], anchor: {de: "Ethnie", fr: "ethnique", it: "etnia"}}
      religion:           {covered_from: 1995-01-01, authority: [fedlex_261bis_2020, fedlex_261bis_2026], anchor: {de: "Religion", fr: "religieuse", it: "religione"}}
      sexual_orientation: {covered_from: 2020-07-01, authority: [as_2020_1609, fedlex_art2], anchor: {de: "sexuellen Orientierung", fr: "orientation sexuelle", it: "orientamento sessuale"}}
      gender_identity:    {covered_from: null, authority: [fedlex_261bis_2026, pa_iv_13_407], anchor: {de: "Geschlechtsidentität", fr: "identité de genre", it: "identità di genere"}}
      sex:                {covered_from: null, authority: [fedlex_261bis_2026], anchor: {de: "Geschlecht", fr: "sexe", it: "sesso"}}
      canton:             {covered_from: null, authority: [fedlex_261bis_2026], anchor: {de: "Kanton", fr: "canton", it: "cantone"}}
      occupation:         {covered_from: null, authority: [fedlex_261bis_2026], anchor: {de: "Beruf", fr: "profession", it: "professione"}}
      age:                {covered_from: null, authority: [fedlex_261bis_2026], anchor: {de: "Alter", fr: "âge", it: "età"}}
      disability:         {covered_from: null, authority: [fedlex_261bis_2026], anchor: {de: "Behinderung", fr: "handicap", it: "disabilità"}}
      political_opinion:  {covered_from: null, authority: [fedlex_261bis_2026], anchor: {de: "politisch", fr: "politique", it: "politic"}}
    fail_reason: >-
      The characteristic is not on the closed list in force at the time of the act (race, ethnicity, religion; sexual
      orientation only for acts from 1 Jul 2020).

  - id: paragraph
    kind: enum
    label: {de: Tathandlung, fr: comportement, it: comportamento}
    authority: [fedlex_261bis_2026]
    values:
      abs1: {satisfied: true, note: call to hatred or discrimination}
      abs2: {satisfied: true, note: spreading an ideology of systematic denigration}
      abs4: {satisfied: true, note: degrading in a manner contrary to human dignity}

  - id: setting
    kind: enum
    label: {de: Öffentlichkeit, fr: caractère public, it: pubblicità}
    authority: [bge_130_iv_111]
    values:
      public:    {satisfied: true}
      private:   {satisfied: false}
      contested: {satisfied: contested}
    fail_reason: >-
      The statement was made in a private setting (family or friends, or a setting shaped by personal relationships or
      particular trust), which is not public under BGE 130 IV 111 E. 5.2.
    contested_reason: >-
      Whether the setting is private depends on the concrete circumstances, including the number of people present
      (BGE 130 IV 111 E. 5.2); the scenario does not fix them.
