# Art. 261bis StGB (Rassendiskriminierung / discrimination et incitation à la haine / discriminazione e incitamento all'odio)
# Machine-readable element model. The gold engine (src/statute_twins/gold/engine.py) computes every verdict from this file
# and nothing else. Every element and every value points to a pinned source in `sources`; tests/test_sources.py checks
# the pinned text hashes, so the encoded law cannot drift silently from the text it cites.
schema: statute-twins/v1
id: stgb_261bis
version: 1.0.0
citation: {de: "Art. 261bis StGB", fr: "art. 261bis CP", it: "art. 261bis CP"}
title: {de: Rassendiskriminierung, fr: Discrimination et incitation à la haine, it: Discriminazione e incitamento all'odio}
scope_note: >-
  Models the objective elements that decide the verdict in the scenarios this package generates: temporal scope,
  protected characteristic (closed list, amended 1 Jul 2020), act paragraph (Abs. 1, 2, 4) and publicity.
  Intent (Vorsatz) is fixed to "present" in every scenario. Abs. 3 (propaganda) and Abs. 5 (refusal of a public service,
  no publicity element) are out of scope. Whether a concrete statement reaches the Abs. 4 dignity threshold is a
  question of fact; the act descriptions are written so that it is met, and the judgement is not modelled.

