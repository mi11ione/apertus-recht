    cite_lang: {fr: "ATF 130 IV 111 consid. 5.2", it: "DTF 130 IV 111 consid. 5.2"}
    kind: decision
    file: ../sources/bge_130_IV_111.json
    ref: BGE 130 IV 111 E. 5.2 (6S.318/2003, 27 May 2004)
    holding: >-
      Öffentlich im Sinne von Art. 261bis StGB sind Äusserungen, die nicht im privaten Rahmen erfolgen. Privat sind
      Äusserungen im Familien- und Freundeskreis oder sonst in einem durch persönliche Beziehungen oder besonderes
      Vertrauen geprägten Umfeld. Ob diese Voraussetzung erfüllt ist, hängt von den konkreten Umständen ab, wobei
      insoweit auch die Zahl der anwesenden Personen eine Rolle spielen kann.
