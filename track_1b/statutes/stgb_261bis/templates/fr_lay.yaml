# French, in the voice of a user asking about their own conduct (A16): the same scenarios and facts as fr.yaml,
# told in the first person and in everyday words, like de_lay.yaml. No statute formulas; the act is described concretely
# enough that the dignity threshold is met; the group is named without its characteristic; intent only in F07.
lang: fr_lay
frames:
  F01: '{Date}, à {place}, {setting}, j''ai {act}.'
  F02: J'habite à {place}. {Date}, {setting}, j'ai {act}.
  F03: 'Une question sur quelque chose que j''ai fait {date} à {place} : {setting}, j''ai {act}.'
  F04: '{Date}, j''étais à {place} et, {setting}, j''ai {act}.'
  F05: J'ai {act} {date} à {place}, {setting}.
  F06: 'Voici ce qui s''est passé : {date}, à {place}, {setting}, j''ai {act}.'
  F07: '{Date}, à {place}, {setting}, j''ai {act}. Je l''ai fait délibérément.'
  F08: 'Pour situer : {date}, à {place}, {setting}, j''ai {act}.'
