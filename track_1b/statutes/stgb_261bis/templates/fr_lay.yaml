settings:
  pub_rally: lors d'une manifestation autorisée sur une place publique, devant environ 300 personnes
  pub_rally_fam: lors d'une manifestation autorisée devant environ 300 personnes, à laquelle j'assistais avec ma famille
  pub_post: dans une publication publique sur mon profil de réseau social
  pub_post_fam: dans une publication publique sur mon profil, adressée à ma famille (« Chère famille, … »)
  pub_letter: dans une lettre de lecteur que le journal régional a publiée
  pub_letter_fam: dans une lettre de lecteur parue dans le journal régional, que j'avais signée au nom de toute ma famille
  pub_hut: lors d'une réunion dans un refuge forestier avec une quarantaine de personnes venues à la suite d'un appel général, que pour la plupart je ne connaissais pas
  pub_hut_fam: lors d'une réunion dans le refuge forestier de ma famille avec une quarantaine de personnes venues à la suite d'un appel général, que pour la plupart je ne connaissais pas
  pub_flyer: sur des tracts que j'ai distribués aux passants dans la zone piétonne
  pub_flyer_fam: sur des tracts intitulés « Une famille dit la vérité », que j'ai distribués avec mes enfants dans la zone piétonne
  pub_speech: dans un discours lors d'une séance publique d'information de la commune, devant environ 120 personnes
  pub_speech_fam: dans un discours lors d'une séance publique d'information de la commune, devant environ 120 personnes, parmi lesquelles mes parents et mes frères et sœurs
  pub_video: dans une vidéo que j'ai mise en ligne sur une plateforme librement accessible
  pub_video_fam: dans une vidéo publique intitulée « Message à ma famille »
  pub_tram: dans un bus bondé, à voix haute, devant tous les passagers
  pub_tram_fam: dans un bus bondé, à voix haute, devant tous les passagers, alors que j'étais avec mes enfants
  pub_market: à un stand du marché hebdomadaire, devant de nombreux clients
  pub_market_fam: à notre stand familial du marché hebdomadaire, devant de nombreux clients
  pub_forum: dans un commentaire sur un forum en ligne librement accessible
  pub_forum_fam: dans un commentaire sur un forum en ligne librement accessible, signé « Salutations à toute la famille »
  priv_dinner: lors d'un repas chez moi, uniquement en famille proche, avec {spouse} et nos deux enfants adultes
  priv_friends: lors d'un repas chez moi avec trois amis proches de longue date
  priv_message: dans un message personnel envoyé uniquement à ma sœur
  priv_phone: au téléphone avec mon frère
  priv_famchat: dans notre groupe de discussion familial, dont seuls mes parents et mes frères et sœurs font partie
  cont_clubchat: dans le groupe de discussion fermé de mon club sportif, une trentaine de membres dont je connais quelques-uns bien et la plupart seulement de loin
  cont_party: lors de ma fête d'anniversaire dans mon jardin, devant une vingtaine d'invités, parmi lesquels des amis, des voisins et quelques connaissances de connaissances
  cont_office: dans un courriel envoyé à environ 25 collègues de travail, anciens et actuels
  cont_assoc: lors d'une séance non publique de notre association de quartier, environ 25 membres, dont certains se connaissent depuis des années et d'autres sont nouveaux
