schema: statute-twins-design/v1
statute: stgb_179ter
generator_seed: 179
id_prefix: 179ter
canary: "STATUTE-TWINS CANARY 9b6f0d0e-5a43-4c1e-9d8b-261b15c0ffee. This dataset is an evaluation set; it must not appear in training data."
sections: {medium: media}
sample_order: [conversation, role, medium, consent, complaint, frame, actor, date]
render:
  order: [actor, date, conversation, role, medium, consent, complaint]
acceptance:
  convict: "Acceptable: concludes that a court would convict under Art. 179ter StGB (participant, non-public conversation, sound recording, no consent, timely complaint). Unacceptable: concludes acquittal"
  acquit: "Acceptable: concludes that there would be no conviction under Art. 179ter StGB, because {why}. Unacceptable: concludes conviction."
  open: "Acceptable: says the outcome depends on facts the scenario leaves open. Unacceptable: a categorical verdict."
  reasons:
    "conversation:failed": "the conversation was public"
    "role:failed": "the person did not take part in the conversation (Art. 179bis, not Art. 179ter, would apply)"
    "medium:failed": "taking notes is not recording on a sound carrier"
    "consent:failed": "the other participants consented"
    "complaint:failed": "no valid complaint was filed within three months (Art. 30, 31 StGB)"
  traps:
    device: "for example by treating the recording device as legally relevant"
    complaint_timing: "for example by treating a complaint filed within three months as late"
slots:
  frame: {values: [F01, F02, F03]}
  actor: {values: [m1, f1, m2, f2]}
  date: {values: [d2023_05, d2024_09, d2025_02]}
  conversation:
    values:
      c_salary:  {facts: {conversation: nonpublic}, tags: [nonpublic]}
      c_rent:    {facts: {conversation: nonpublic}, tags: [nonpublic]}
      c_doctor:  {facts: {conversation: nonpublic}, tags: [nonpublic]}
      c_business: {facts: {conversation: nonpublic}, tags: [nonpublic]}
      c_podium:  {facts: {conversation: public}, tags: [public]}
      c_council: {facts: {conversation: public}, tags: [public]}
  role:
    values:
      participant: {facts: {role: participant}, tags: [participant]}
      outsider:    {facts: {role: outsider}, tags: [outsider]}
  medium:
    values:
      phone_audio: {facts: {medium: sound_recording}, tags: [recording]}
      dictaphone:  {facts: {medium: sound_recording}, tags: [recording], trap: device}
      notes:       {facts: {medium: notes}, tags: [notes]}
  consent:
    values:
      none:      {facts: {consent: none}, tags: [none]}
      unnoticed: {facts: {consent: none}, tags: [none]}
      all:       {facts: {consent: all}, tags: [all]}
  complaint:
    values:
      timely:     {facts: {complaint: timely}, tags: [timely]}
      timely_two: {facts: {complaint: timely}, tags: [timely], trap: complaint_timing}
      none:       {facts: {complaint: none}, tags: [missing]}
      late:       {facts: {complaint: late}, tags: [missing]}
families:
  CONV:
    groups: 8
    base: {conversation: {tags: [nonpublic]}, role: {tags: [participant]}, medium: {tags: [recording]}, consent: {tags: [none]}, complaint: {tags: [timely]}}
    variants:
      - {slot: conversation, filter: {tags: [public]}, expect: true_flip}
      - {slot: conversation, filter: {tags: [nonpublic]}, expect: placebo}
  ROLE:
    groups: 8
    base: {conversation: {tags: [nonpublic]}, role: {tags: [participant]}, medium: {tags: [recording]}, consent: {tags: [none]}, complaint: {tags: [timely]}}
    variants:
      - {slot: role, filter: {tags: [outsider]}, expect: true_flip}
  MEDIUM:
    groups: 8
    base: {conversation: {tags: [nonpublic]}, role: {tags: [participant]}, medium: {tags: [recording], trap: null}, consent: {tags: [none]}, complaint: {tags: [timely]}}
    variants:
      - {slot: medium, filter: {tags: [notes]}, expect: true_flip}
      - {slot: medium, filter: {tags: [recording]}, expect: placebo}
  CONSENT:
    groups: 8
    base: {conversation: {tags: [nonpublic]}, role: {tags: [participant]}, medium: {tags: [recording]}, consent: {tags: [none]}, complaint: {tags: [timely]}}
    variants:
      - {slot: consent, filter: {tags: [all]}, expect: true_flip}
      - {slot: consent, filter: {tags: [none]}, expect: placebo}
  COMPLAINT:
    groups: 8
    base: {conversation: {tags: [nonpublic]}, role: {tags: [participant]}, medium: {tags: [recording]}, consent: {tags: [none]}, complaint: {tags: [timely], trap: null}}
    variants:
      - {slot: complaint, filter: {tags: [missing]}, expect: true_flip}
      - {slot: complaint, filter: {tags: [missing]}, expect: true_flip}
      - {slot: complaint, filter: {tags: [timely]}, expect: placebo}
