lang: de
frames:
  F01: "Sachverhalt: {Date} fand {conversation} statt. {Role} {Medium} {Consent} {Complaint}"
  F02: "Sachverhalt: Gemäss Polizeirapport fand {date} {conversation} statt. {Role} {Medium} {Consent} {Complaint}"
  F03: "Sachverhalt: Folgendes ist erstellt: {Date} fand {conversation} statt. {Role} {Medium} {Consent} {Complaint}"
actors:
  m1: {surface: "ein Mann", gender: m}
  m2: {surface: "ein 45-jähriger Mann", gender: m}
  f1: {surface: "eine Frau", gender: f}
  f2: {surface: "eine 38-jährige Frau", gender: f}
morphology:
  m: {pron: er, poss_dat_n: seinem, poss_dat_m: seinem}
  f: {pron: sie, poss_dat_n: ihrem, poss_dat_m: ihrem}
dates:
  d2023_05: "im Mai 2023"
  d2024_09: "im September 2024"
  d2025_02: "im Februar 2025"
conversations:
  c_salary: "in einem Sitzungszimmer ein vertrauliches Gespräch über eine Lohnerhöhung"
  c_rent: "in der Wohnung der Vermieterin ein Gespräch über eine Mietzinserhöhung"
  c_doctor: "in einer Arztpraxis ein Gespräch über eine Diagnose"
  c_business: "in einem Restaurant ein vertrauliches Geschäftsgespräch unter vier Augen"
  c_podium: "an einer öffentlichen Podiumsdiskussion vor rund 200 Zuhörenden ein Streitgespräch"
  c_council: "an einer öffentlichen Sitzung des Gemeindeparlaments eine Debatte"
roles:
  participant: "{Actor} nahm selbst an diesem Gespräch teil."
  outsider: "{Actor} nahm nicht daran teil, hörte aber aus dem Nebenraum mit."
media:
  phone_audio: "{Pron} zeichnete das Gespräch mit {poss_dat_n} Smartphone als Tonaufnahme auf."
  dictaphone: "{Pron} zeichnete das Gespräch mit einem Diktiergerät als Tonaufnahme auf."
  notes: "{Pron} schrieb den Inhalt des Gesprächs stichwortartig von Hand mit."
consents:
  none: "Wer sonst am Gespräch teilnahm, war damit nicht einverstanden."
  unnoticed: "Wer sonst am Gespräch teilnahm, bemerkte es nicht und hatte nicht eingewilligt."
  all: "Wer sonst am Gespräch teilnahm, hatte vorher ausdrücklich eingewilligt."
complaints:
  timely: "Eine am Gespräch beteiligte Person erfuhr davon und auch, wer es war; zwei Wochen später stellte sie Strafantrag."
  timely_two: "Eine am Gespräch beteiligte Person erfuhr davon und auch, wer es war; knapp drei Monate später stellte sie Strafantrag."
  none: "Niemand stellte Strafantrag."
  late: "Eine am Gespräch beteiligte Person erfuhr davon und auch, wer es war; erst fünf Monate später stellte sie Strafantrag."
# legal review (10 Oct 2026): for an outsider the consent sentence must not say "who else took part"
rewrite:
  - ['(Nebenraum mit\..*?)Wer sonst am', '\1Wer am']
